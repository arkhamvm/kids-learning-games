<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Слова-друзья</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='28' fill='%2358cc02'/%3E%3Ccircle cx='22' cy='30' r='10' fill='%23fff'/%3E%3Ccircle cx='42' cy='30' r='10' fill='%23fff'/%3E%3Ccircle cx='23' cy='31' r='5' fill='%233c3c3c'/%3E%3Ccircle cx='41' cy='31' r='5' fill='%233c3c3c'/%3E%3Cpath d='M28 41 L36 41 L32 48 Z' fill='%23ff9600'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #58cc02; --green-d: #46a302; --green-l: #d7ffb8; --green-t: #58a700;
    --red: #ff4b4b; --red-d: #ea2b2b; --red-l: #ffdfe0; --red-t: #ea2b2b;
    --blue: #1cb0f6; --blue-d: #1899d6; --blue-l: #ddf4ff;
    --purple: #ce82ff; --purple-l: #f4e5ff; --purple-t: #a568cc;
    --orange: #ff9600; --orange-l: #fff0db; --orange-t: #cc7800;
    --gold: #ffc800; --gold-d: #e6a800;
    --ink: #3c3c3c; --ink-2: #4b4b4b; --muted: #777; --faint: #afafaf;
    --line: #e5e5e5; --soft: #f7f7f7; --bg: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html, button { touch-action: manipulation; } /* no double-tap zoom on fast taps */
  body {
    background: var(--bg); color: var(--ink);
    font-family: Nunito, "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    font-weight: 700;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  .app { max-width: 680px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
  main { flex: 1; display: flex; flex-direction: column; }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 14px; height: 64px; flex: none; }
  .icon-btn { width: 40px; height: 40px; border: 0; background: none; border-radius: 12px; display: grid; place-items: center; color: var(--faint); flex: none; }
  .progress { flex: 1; height: 16px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--green); border-radius: 99px; position: relative; transition: width .6s cubic-bezier(.3, 1.4, .5, 1); }
  .progress-fill::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.35); }
  .streak { display: flex; align-items: center; gap: 4px; min-width: 52px; font-size: 19px; font-weight: 900; color: var(--orange); flex: none; }
  .streak svg { width: 26px; height: 26px; }
  .streak.off { color: var(--faint); }
  .streak.off .flame-out { fill: var(--line); }
  .streak.off .flame-in { fill: #f0f0f0; }
  .streak.bump svg { animation: bump .45s cubic-bezier(.3, 1.6, .5, 1); }
  .streak.hot svg { filter: drop-shadow(0 0 6px rgba(255,150,0,.55)); }
  body:not([data-screen="quiz"]) .quiz-only { visibility: hidden; }

  /* ---------- screens ---------- */
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; animation: screenIn .35s ease both; }
  @keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- buttons ---------- */
  .btn {
    border: 0; border-radius: 16px; padding: 14px 26px;
    font-size: 17px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;
    background: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-d);
    transition: transform .08s, box-shadow .08s, filter .15s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--green-d); }
  .btn--red { background: var(--red); box-shadow: 0 4px 0 var(--red-d); }
  .btn--red:active { box-shadow: 0 0 0 var(--red-d); }
  .btn-wide { width: 100%; max-width: 360px; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  /* ---------- start / end ---------- */
  .center { align-items: center; text-align: center; gap: 14px; padding: 4px 0 40px; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hero .bubble { max-width: 340px; margin-bottom: 8px; }
  .owl-slot--big { width: min(210px, 52vw); }
  h1, h2 { margin: 0; font-weight: 900; color: var(--ink); }
  h1 { font-size: clamp(32px, 7vw, 44px); }
  h2 { font-size: clamp(28px, 6vw, 36px); }
  .lead { margin: 0; max-width: 440px; font-size: 18px; line-height: 1.45; color: var(--muted); }
  .example { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; font-size: 20px; font-weight: 900; }
  .chip { padding: 8px 14px; background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; }
  .example .eq { color: var(--green); font-size: 26px; }
  .hint { margin: 2px 0 0; font-size: 14px; color: var(--faint); }

  /* ---------- quiz ---------- */
  .quiz { padding-bottom: 190px; }
  .q-head { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  .owl-slot--quiz { width: 124px; flex: none; }
  .q-head .bubble { flex: 1; max-width: 340px; }
  .q-card { margin-top: 14px; }
  .q-card.enter { animation: screenIn .35s ease both; }
  .q-label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; color: var(--muted); }
  .tag { padding: 3px 9px; border-radius: 8px; font-size: 13px; font-weight: 900; letter-spacing: .02em; }
  .tag--purple { background: var(--purple-l); color: var(--purple-t); }
  .tag--blue { background: var(--blue-l); color: var(--blue-d); }
  .tag--orange { background: var(--orange-l); color: var(--orange-t); }
  .tag--green { background: var(--green-l); color: var(--green-t); }
  .q-word { display: flex; align-items: center; gap: 14px; margin-top: 4px; font-size: clamp(36px, 9vw, 50px); font-weight: 900; color: var(--ink); line-height: 1.15; }
  .speak {
    width: 46px; height: 46px; flex: none; border: 0; border-radius: 14px; display: grid; place-items: center;
    background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-d); transition: transform .08s, box-shadow .08s;
  }
  .speak:active { transform: translateY(4px); box-shadow: 0 0 0 var(--blue-d); }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .opt {
    display: flex; align-items: center; gap: 12px; min-height: 70px; padding: 12px 16px;
    background: #fff; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 16px;
    text-align: left; font-size: 21px; font-weight: 800; color: var(--ink-2);
    transition: background .15s, border-color .15s, color .15s, opacity .25s, transform .08s;
    animation: optIn .3s ease backwards; animation-delay: calc(var(--i) * 55ms);
  }
  @keyframes optIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .opt:active:not(:disabled) { transform: translateY(2px); }
  .opt:disabled { cursor: default; }
  .opt { scroll-margin: 16px 0 230px; } /* keep the answer above the feedback sheet */
  /* hover only for real pointers — on touch screens :hover sticks after a tap */
  @media (hover: hover) {
    .icon-btn:hover { background: var(--soft); color: var(--muted); }
    .btn:hover { filter: brightness(1.06); }
    .opt:hover:not(:disabled) { background: var(--soft); }
  }
  .opt-key { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 9px; font-size: 14px; font-weight: 900; color: var(--faint); }
  .opt.correct { background: var(--green-l); border-color: var(--green); color: var(--green-t); animation: correctPop .4s cubic-bezier(.3, 1.6, .5, 1); }
  .opt.correct .opt-key { border-color: var(--green); color: var(--green-t); }
  .opt.wrong { background: var(--red-l); border-color: var(--red); color: var(--red-t); animation: shake .45s; }
  .opt.wrong .opt-key { border-color: var(--red); color: var(--red-t); }
  .opt.dim { opacity: .4; }
  @keyframes correctPop { 0% { transform: scale(1); } 45% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
  @keyframes bump { 0% { transform: scale(1); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }

  /* ---------- feedback sheet ---------- */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--green-l); transform: translateY(105%); visibility: hidden;
    transition: transform .3s cubic-bezier(.2, .9, .3, 1.1), visibility 0s .3s;
  }
  .sheet.show { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2, .9, .3, 1.1); }
  .sheet.bad { background: var(--red-l); }
  .sheet-inner { max-width: 680px; margin: 0 auto; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 14px; }
  .sheet-icon { width: 58px; height: 58px; flex: none; display: grid; place-items: center; border-radius: 50%; background: #fff; }
  .sheet-icon svg { width: 34px; height: 34px; }
  .sheet-title { font-size: 22px; font-weight: 900; color: var(--green-t); }
  .sheet-sub { margin-top: 2px; font-size: 17px; font-weight: 800; color: var(--green-t); }
  .sheet.bad .sheet-title, .sheet.bad .sheet-sub { color: var(--red-t); }
  .sheet .btn { margin-left: auto; min-width: 150px; }

  /* ---------- results ---------- */
  .stars { display: flex; align-items: flex-end; justify-content: center; gap: 6px; height: 84px; }
  .star { width: 56px; height: 56px; }
  .star:nth-child(2) { width: 76px; height: 76px; margin-bottom: 8px; }
  .star path { fill: var(--line); stroke: #d4d4d4; stroke-width: 1.2; stroke-linejoin: round; }
  .star.on path { fill: var(--gold); stroke: var(--gold-d); }
  .stars.animate .star.on { animation: starPop .55s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes starPop { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: none; } }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 460px; }
  .stat { border: 2px solid var(--c); border-radius: 16px; background: var(--c); overflow: hidden; }
  .stat-label { padding: 5px 4px; font-size: 12px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; color: #fff; }
  .stat-val { padding: 12px 4px; background: #fff; border-radius: 13px; font-size: 22px; font-weight: 900; color: var(--c); }
  .review { width: 100%; max-width: 460px; text-align: left; }
  .review h3 { margin: 6px 0 10px; font-size: 18px; font-weight: 900; }
  .review ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .review li { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 14px; }
  .pair { font-size: 18px; font-weight: 900; }
  .pair .ok { color: var(--green-t); }
  .was { font-size: 14px; color: var(--muted); }
  .was s { color: var(--red-t); }

  /* ===== OWL:CSS START ===== */
  /* Совёнок Ух: speech bubble + mascot + confetti. Source of truth: templates/owl-mascot.html */
  .bubble {
    position: relative; background: #fff; border: 2px solid var(--line, #e5e5e5); border-radius: 18px;
    padding: 12px 16px; font-size: 17px; font-weight: 800; line-height: 1.35; color: var(--ink-2, #4b4b4b);
  }
  .bubble::before { content: ""; position: absolute; width: 18px; height: 18px; background: #fff; }
  .bubble--left::before { left: -11px; top: 50%; transform: translateY(-50%) rotate(45deg); border-left: 2px solid var(--line, #e5e5e5); border-bottom: 2px solid var(--line, #e5e5e5); }
  .bubble--down::before { left: 50%; bottom: -11px; transform: translateX(-50%) rotate(45deg); border-right: 2px solid var(--line, #e5e5e5); border-bottom: 2px solid var(--line, #e5e5e5); }
  .bubble.pop { animation: owl-pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes owl-pop { 0% { transform: scale(.85); opacity: .3; } 100% { transform: none; opacity: 1; } }

  .owl { display: block; width: 100%; height: auto; overflow: visible; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .owl * { transform-box: fill-box; }
  .owl .o-shadow { transform-origin: center; animation: owl-shadow 2.6s ease-in-out infinite; }
  .owl .o-body { transform-origin: 50% 100%; animation: owl-bob 2.6s ease-in-out infinite; }
  .owl .o-tilt { transform-origin: 50% 100%; transition: transform .4s ease; }
  .owl .o-wing-l { transform-origin: 85% 5%; transition: transform .3s ease; }
  .owl .o-wing-r { transform-origin: 15% 5%; transition: transform .3s ease; }
  .owl .o-lid { transform-origin: 50% 0; transform: scaleY(0); animation: owl-blink 4.4s infinite; transition: transform .25s ease; }
  .owl .o-mood { transition: transform .3s ease; }
  .owl .o-open { transition: opacity .15s; }
  .owl .o-happy, .owl .o-brows, .owl .o-cheeks, .owl .o-tear { opacity: 0; transition: opacity .2s; }
  .owl .o-mouth { transform-origin: 50% 0; transform: scaleY(0); transition: transform .2s ease; }
  .owl .o-cap { transform-origin: 50% 100%; }
  @keyframes owl-bob { 50% { transform: translateY(-4px); } }
  @keyframes owl-shadow { 50% { transform: scaleX(.92); } }
  @keyframes owl-blink { 0%, 91%, 100% { transform: scaleY(0); } 94% { transform: scaleY(1); } }

  /* wave: greeting */
  .owl.is-wave .o-wing-r { animation: owl-wave 1.1s ease-in-out infinite; }
  @keyframes owl-wave { 0%, 100% { transform: rotate(-110deg); } 50% { transform: rotate(-150deg); } }

  /* think: question on screen */
  .owl.is-think .o-tilt { transform: rotate(-5deg); }
  .owl.is-think .o-mood { transform: translate(4px, -5px); }

  /* happy: correct answer */
  .owl.is-happy .o-body { animation: owl-hop .55s cubic-bezier(.3, .7, .4, 1) 2, owl-bob 2.6s ease-in-out 1.1s infinite; }
  .owl.is-happy .o-shadow { animation: owl-hop-shadow .55s 2; }
  .owl.is-happy .o-wing-l { animation: owl-flap-l .26s ease-in-out 4; }
  .owl.is-happy .o-wing-r { animation: owl-flap-r .26s ease-in-out 4; }
  .owl.is-happy .o-open, .owl.is-party .o-open { opacity: 0; }
  .owl.is-happy .o-happy, .owl.is-happy .o-cheeks,
  .owl.is-party .o-happy, .owl.is-party .o-cheeks { opacity: 1; }
  .owl.is-happy .o-mouth, .owl.is-party .o-mouth { transform: scaleY(1); }
  @keyframes owl-hop {
    0% { transform: none; }
    20% { transform: scale(1.08, .9); }
    50% { transform: translateY(-28px) scale(.95, 1.06); }
    80% { transform: scale(1.04, .96); }
    100% { transform: none; }
  }
  @keyframes owl-hop-shadow { 50% { transform: scale(.7); opacity: .05; } }
  @keyframes owl-flap-l { 50% { transform: rotate(60deg); } }
  @keyframes owl-flap-r { 50% { transform: rotate(-60deg); } }

  /* sad: wrong answer */
  .owl.is-sad .o-body { animation: owl-sad-shake .55s ease-in-out both; }
  .owl.is-sad .o-wing-l { transform: rotate(-10deg); }
  .owl.is-sad .o-wing-r { transform: rotate(10deg); }
  .owl.is-sad .o-lid { animation: none; }
  .owl.is-sad .o-lid-l { transform: rotate(-14deg) scaleY(.42); }
  .owl.is-sad .o-lid-r { transform: rotate(14deg) scaleY(.42); }
  .owl.is-sad .o-mood { transform: translate(0, 6px); }
  .owl.is-sad .o-brows { opacity: 1; }
  .owl.is-sad .o-tear { opacity: 1; animation: owl-tear 1.7s ease-in .35s infinite; }
  @keyframes owl-sad-shake {
    0% { transform: none; }
    15% { transform: translateX(-7px) rotate(-5deg); }
    35% { transform: translateX(7px) rotate(5deg); }
    55% { transform: translateX(-4px) rotate(-2deg); }
    75% { transform: translateX(2px); }
    100% { transform: translateY(5px) scale(1.03, .95); }
  }
  @keyframes owl-tear { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(42px); opacity: 0; } }

  /* party: good final result */
  .owl.is-party .o-body { animation: owl-hop .6s cubic-bezier(.3, .7, .4, 1) infinite; }
  .owl.is-party .o-shadow { animation: owl-hop-shadow .6s infinite; }
  .owl.is-party .o-wing-l { animation: owl-flap-l .3s ease-in-out infinite; }
  .owl.is-party .o-wing-r { animation: owl-flap-r .3s ease-in-out infinite; }
  .owl.is-party .o-cap { animation: owl-cap-toss 1.2s ease-in-out infinite; }
  @keyframes owl-cap-toss { 0%, 100% { transform: none; } 50% { transform: translateY(-14px) rotate(-14deg); } }

  /* poke: tap / click on the owl */
  .owl.poke .o-tilt { animation: owl-wiggle .5s ease-in-out; }
  @keyframes owl-wiggle { 0%, 100% { transform: none; } 25% { transform: rotate(-9deg); } 60% { transform: rotate(7deg); } }

  .owl-fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

  @media (prefers-reduced-motion: reduce) {
    .owl *, .bubble { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  /* ===== OWL:CSS END ===== */

  @media (max-width: 460px) {
    .options { grid-template-columns: 1fr; gap: 10px; margin-top: 18px; }
    .opt { min-height: 58px; font-size: 20px; }
    .owl-slot--quiz { width: 100px; }
    .q-head .bubble { font-size: 16px; padding: 10px 14px; }
    .sheet-inner { flex-wrap: wrap; padding-top: 16px; }
    .sheet-icon { width: 46px; height: 46px; }
    .sheet-icon svg { width: 28px; height: 28px; }
    .sheet .btn { width: 100%; margin-left: 0; }
    .quiz { padding-bottom: 210px; }
    .stat-label { font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body data-screen="start">

<div class="app">
  <header class="topbar">
    <button class="icon-btn quiz-only" id="btnQuit" type="button" aria-label="Выйти в начало" title="Выйти">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
    </button>
    <div class="progress quiz-only" role="progressbar" aria-label="Прогресс" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progressBar">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="streak quiz-only off" id="streak" title="Правильных ответов подряд">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="flame-out" d="M12 1.8c1.2 4.2 5.6 5.8 5.6 11.2a5.6 5.6 0 0 1-11.2 0c0-2.3 1.1-4 2.3-5.1 0 2.2 1 3.3 2.1 3.4-.2-3.3.1-6.6 1.2-9.5z" fill="#ff9600"/>
        <path class="flame-in" d="M12 13.4c.7 1.7 2.7 2.4 2.7 4.3a2.7 2.7 0 0 1-5.4 0c0-1.5 1-2.5 1.7-3.1.3 1 1 1.2 1 1.2z" fill="#ffc800"/>
      </svg>
      <span id="streakNum">0</span>
    </div>
    <button class="icon-btn" id="btnSound" type="button" aria-label="Звук" aria-pressed="true" title="Звук"></button>
  </header>

  <main>
    <!-- старт -->
    <section class="screen center active" id="screenStart">
      <div class="hero">
        <div class="bubble bubble--down pop" id="bubbleStart">Привет! Я совёнок Ух. Давай искать слова-друзья!</div>
        <div class="owl-slot owl-slot--big" id="slotStart">
          <!-- ===== OWL:SVG START ===== -->
          <svg class="owl is-wave" id="owl" viewBox="0 0 200 220" role="img" aria-label="Совёнок Ух">
            <defs>
              <clipPath id="eyeClipL"><circle cx="76" cy="92" r="23"/></clipPath>
              <clipPath id="eyeClipR"><circle cx="124" cy="92" r="23"/></clipPath>
            </defs>
            <ellipse class="o-shadow" cx="100" cy="207" rx="52" ry="7" fill="#000" opacity=".1"/>
            <g class="o-body">
              <g class="o-tilt">
                <!-- лапки -->
                <g fill="#ff9600">
                  <path d="M66 201c0-9 6-14 13-14s13 5 13 14c-2 3-5 3-6.5 0-1.5 3-5 3-6.5 0-1.5 3-5 3-6.5 0-1.5 3-5 3-6.5 0z"/>
                  <path d="M108 201c0-9 6-14 13-14s13 5 13 14c-2 3-5 3-6.5 0-1.5 3-5 3-6.5 0-1.5 3-5 3-6.5 0-1.5 3-5 3-6.5 0z"/>

<script>
// ===== OWL:JS START =====
// Совёнок Ух: mascot controller. Source of truth: templates/owl-mascot.html
const Mascot = (() => {
  const owl = document.getElementById('owl');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const phrases = {
    hello: 'Привет! Я совёнок Ух. Давай играть!',
    first: 'Ух-ух! Выбирай правильный ответ!',
    ask: ['Подумай хорошенько…', 'Ух-ух! Выбирай!', 'Я знаю, ты справишься!', 'Какой ответ правильный?'],
    ok: ['Молодец!', 'Верно!', 'Супер!', 'Умница!', 'Так держать!', 'Ух ты, здорово!', 'Правильно!', 'Вот это да!'],
    okTitle: ['Отлично!', 'Верно!', 'Превосходно!', 'Правильно!', 'Здорово!'],
    bad: ['Ой! Ничего страшного.', 'Почти! Запомни этот ответ.', 'Ух… ошибочка. Ты справишься!', 'Не беда, идём дальше!'],
    streak: { 3: 'Три подряд! Ты в ударе!', 5: 'Пять подряд! Ух-ух-ух!', 7: 'Семь подряд! Невероятно!', 10: 'Десять подряд! Ты чемпион!' },
    poke: ['Ух-ух!', 'Хи-хи, щекотно!', 'Я в тебя верю!', 'Совы обожают учиться!', 'Ух! Привет-привет!'],
    results: [
      { title: 'Попробуем ещё раз?', say: 'Не грусти! С каждым разом будет получаться лучше.' },
      { title: 'Хорошее начало!', say: 'У тебя уже получается. Давай ещё!' },
      { title: 'Отлично!', say: 'Здорово! Ещё чуть-чуть — и будет идеально!' },
      { title: 'Великолепно!', say: 'Ух-ух! Ты настоящий знаток!' },
    ],
  };

  let lastPick = null;
  function pick(arr) {
    let x;
    do { x = arr[Math.floor(Math.random() * arr.length)]; } while (arr.length > 1 && x === lastPick);
    return (lastPick = x);
  }

  // ---- state + speech bubble ----
  let bubble = null;
  let busy = false; // an answer reaction is on screen: poking doesn't replace its phrase
  function set(state) {
    owl.classList.remove('is-wave', 'is-think', 'is-happy', 'is-sad', 'is-party');
    owl.getBoundingClientRect(); // restart CSS animations
    if (state) owl.classList.add('is-' + state);
  }
  function say(text) {
    if (!bubble) return;
    bubble.textContent = text;
    bubble.classList.remove('pop');
    void bubble.offsetWidth;
    bubble.classList.add('pop');
  }
  function mount(slot, bubbleEl) {
    if (slot && owl.parentNode !== slot) slot.appendChild(owl);
    bubble = bubbleEl || null;
  }

  // ---- eyes follow the mouse / finger ----
  const tracks = owl.querySelectorAll('.o-track');
  function look(x, y) {
    const r = owl.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2);
    const dy = y - (r.top + r.height * 0.42);
    const d = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, d / 260) * 5;
    const t = `translate(${(dx / d * k).toFixed(1)} ${(dy / d * k).toFixed(1)})`;
    tracks.forEach((g) => g.setAttribute('transform', t));
  }
  addEventListener('pointermove', (e) => look(e.clientX, e.clientY), { passive: true });
  addEventListener('pointerdown', (e) => look(e.clientX, e.clientY), { passive: true });
  document.documentElement.addEventListener('pointerleave', (e) => {
    if (e.pointerType === 'mouse') tracks.forEach((g) => g.removeAttribute('transform'));
  });
  // iOS Safari applies :active (button press effect) only when a touchstart listener exists
  document.addEventListener('touchstart', () => {}, { passive: true });

  // ---- poke ----
  owl.addEventListener('click', () => {
    owl.classList.remove('poke');
    owl.getBoundingClientRect();
    owl.classList.add('poke');
    sfx('hoot');
    if (!busy) say(pick(phrases.poke));
  });
  owl.addEventListener('animationend', (e) => {
    if (e.animationName === 'owl-wiggle') owl.classList.remove('poke');
  });

  // ---- sound: Web Audio, no files; on/off shared by all games ----
  let actx = null;
  let soundOn = true;
  try { soundOn = localStorage.getItem('owl-sound') !== 'off'; } catch (e) {}
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, at, dur, type = 'sine', vol = 0.18, toFreq) {
    const a = audio();
    if (!a) return;
    const t0 = a.currentTime + at;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  }
  const SFX = {
    ok:   () => { tone(784, 0, 0.12, 'sine', 0.2); tone(1047, 0.09, 0.24, 'sine', 0.2); },
    bad:  () => { tone(330, 0, 0.16, 'triangle', 0.24, 300); tone(247, 0.14, 0.32, 'triangle', 0.24, 210); },
    hoot: () => { tone(540, 0, 0.16, 'sine', 0.16, 450); tone(540, 0.22, 0.24, 'sine', 0.16, 410); },
    win:  () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, k * 0.1, 0.28, 'sine', 0.16)),
    end:  () => [523, 659, 784].forEach((f, k) => tone(f, k * 0.13, 0.24, 'sine', 0.14)),
  };
  function sfx(name) {
    if (!soundOn || !SFX[name]) return;
    try { SFX[name](); } catch (e) {}
  }

  // ---- confetti ----
  const fx = document.createElement('canvas');
  fx.className = 'owl-fx';
  fx.setAttribute('aria-hidden', 'true');
  document.body.appendChild(fx);
  const ctx = fx.getContext('2d');
  const COLORS = ['#58cc02', '#1cb0f6', '#ffc800', '#ff4b4b', '#ce82ff', '#ff9600'];
  let parts = [];
  let raf = 0;
  let dpr = 1;
  function sizeFx() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    fx.width = innerWidth * dpr;
    fx.height = innerHeight * dpr;
  }
  addEventListener('resize', sizeFx);
  sizeFx();
  function spawn(x, y, vx, vy, max) {
    parts.push({
      x, y, vx, vy, max, life: 0,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
      r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
      c: COLORS[Math.floor(Math.random() * COLORS.length)],
    });
  }
  function run() { if (!raf) raf = requestAnimationFrame(tick); }
  function tick() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life < p.max && p.y < innerHeight + 30);
    for (const p of parts) {
      p.life++;
      p.vy = (p.vy + 0.18) * 0.985;
      p.vx *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.r += p.vr;
      ctx.globalAlpha = Math.min(1, (p.max - p.life) / 20);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life * 0.15 + p.r)) + 1);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }
  function burst(x, y, n = 26) {
    if (reduceMotion) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 2 + Math.random() * 5;
      spawn(x, y, Math.cos(a) * s, Math.sin(a) * s - 3, 60 + Math.random() * 40);
    }
    run();
  }
  function rain() {
    if (reduceMotion) return;
    for (let i = 0; i < 170; i++) {
      spawn(Math.random() * innerWidth, -20 - Math.random() * innerHeight * 0.7, (Math.random() - 0.5) * 2, 2 + Math.random() * 3, 320);
    }
    run();
  }

  // ---- game events ----
  function hello(text) {
    busy = false;
    set('wave');
    say(text || phrases.hello);
  }
  function question(isFirst) {
    busy = false;
    set('think');
    say(isFirst ? phrases.first : pick(phrases.ask));
  }
  function correct(streak, fromEl) {
    busy = true;
    set('happy');
    sfx('ok');
    say(phrases.streak[streak] || pick(phrases.ok));
    if (fromEl) {
      const r = fromEl.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2);
    }
    return pick(phrases.okTitle);
  }
  function wrong() {
    busy = true;
    set('sad');
    sfx('bad');
    say(pick(phrases.bad));
  }
  function finish(score, total) {
    const ratio = total ? score / total : 0;
    const stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : ratio >= 0.4 ? 1 : 0;
    const res = phrases.results[stars];
    busy = false;
    set(stars >= 2 ? 'party' : stars === 1 ? 'happy' : 'wave');
    say(res.say);
    sfx(stars >= 2 ? 'win' : 'end');
    if (stars >= 2) setTimeout(rain, 250);
    return { stars, title: res.title };
  }

  return {
    el: owl, phrases, pick, mount, set, say, sfx, burst, rain,
    hello, question, correct, wrong, finish,
    get sound() { return soundOn; },
    set sound(on) {
      soundOn = Boolean(on);
      try { localStorage.setItem('owl-sound', soundOn ? 'on' : 'off'); } catch (e) {}
    },
  };
})();

      ['смех', 'хохот', 'плач', 'шёпот', 'сон'],
      ['ошибка', 'промах', 'успех', 'задача', 'ответ'],
      ['миг', 'мгновение', 'час', 'год', 'день'],
    ]],
    ['verb', [
      ['бежать', 'мчаться', 'стоять', 'ползти', 'спать'],
      ['идти', 'шагать', 'стоять', 'лежать', 'лететь'],
      ['спешить', 'торопиться', 'медлить', 'отдыхать', 'ждать'],
      ['говорить', 'разговаривать', 'молчать', 'слушать', 'писать'],
      ['кричать', 'вопить', 'шептать', 'молчать', 'слушать'],
      ['смотреть', 'глядеть', 'слушать', 'нюхать', 'спать'],
      ['думать', 'размышлять', 'бегать', 'плакать', 'прыгать'],
      ['плакать', 'рыдать', 'смеяться', 'петь', 'бегать'],
      ['смеяться', 'хохотать', 'плакать', 'грустить', 'молчать'],
      ['радоваться', 'веселиться', 'грустить', 'сердиться', 'плакать'],
      ['строить', 'сооружать', 'ломать', 'рисовать', 'читать'],
      ['чинить', 'ремонтировать', 'ломать', 'мыть', 'красить'],
      ['трудиться', 'работать', 'отдыхать', 'лениться', 'спать'],
      ['помогать', 'выручать', 'мешать', 'ругать', 'обижать'],
      ['прятаться', 'скрываться', 'искать', 'бегать', 'играть'],
      ['искать', 'разыскивать', 'прятать', 'терять', 'ломать'],
      ['бросать', 'кидать', 'ловить', 'держать', 'нести'],
      ['сражаться', 'биться', 'мириться', 'отдыхать', 'петь'],
      ['здороваться', 'приветствовать', 'прощаться', 'спорить', 'молчать'],
      ['кушать', 'есть', 'пить', 'спать', 'играть'],
    ]],
    ['adv', [
      ['сейчас', 'теперь', 'вчера', 'потом', 'завтра'],
      ['сразу', 'тотчас', 'потом', 'вчера', 'медленно'],
      ['вокруг', 'кругом', 'вверху', 'внутри', 'далеко'],
    ]],
  ].flatMap(([t, list]) => list.map(([w, a, ...d]) => ({ t, w, a, d })));

  // ---------- реплики совёнка под тему игры (остальные — из шаблона) ----------
  Object.assign(Mascot.phrases, {
    hello: 'Привет! Я совёнок Ух. Давай искать слова-друзья!',
    first: 'Найди слово-друга: оно значит почти то же самое!',
    ask: ['Какое слово значит почти то же самое?', 'Найди слово-друга!', 'Подумай хорошенько…', 'Какое слово подходит по смыслу?', 'Ух-ух! Выбирай!', 'Я знаю, ты справишься!'],
    poke: ['Ух-ух!', 'Хи-хи, щекотно!', 'Я в тебя верю!', 'Совы обожают слова!', 'Ух! Привет-привет!'],
    results: [
      { title: 'Попробуем ещё раз?', say: 'Не грусти! С каждым разом будет получаться лучше.' },
      { title: 'Хорошее начало!', say: 'Ты уже знаешь немало слов-друзей. Давай ещё!' },
      { title: 'Отлично!', say: 'Здорово! Ещё чуть-чуть — и будет идеально!' },
      { title: 'Великолепно!', say: 'Ух-ух! Ты настоящий знаток слов!' },
    ],
  });

  const ICON = {
    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#58a700" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    cross: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" stroke="#ea2b2b" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>',
    soundOn: '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',
  };

  // ---------- helpers ----------
  const $ = (s) => document.querySelector(s);
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- elements ----------
  const screens = { start: $('#screenStart'), quiz: $('#screenQuiz'), end: $('#screenEnd') };
  const slots = { start: $('#slotStart'), quiz: $('#slotQuiz'), end: $('#slotEnd') };
  const bubbles = { start: $('#bubbleStart'), quiz: $('#bubbleQuiz'), end: $('#bubbleEnd') };
  const optsEl = $('#options');
  const sheet = $('#sheet');
  const btnNext = $('#btnNext');
  const btnSound = $('#btnSound');
  const btnSpeak = $('#btnSpeak');
  const streakEl = $('#streak');

  // ---------- screens ----------
  let current = 'start';

  function show(name) {
    current = name;
    Object.entries(screens).forEach(([k, el]) => el.classList.toggle('active', k === name));
    document.body.dataset.screen = name;
    Mascot.mount(slots[name], bubbles[name]);
    window.scrollTo(0, 0);
  }

  // ---------- звук ----------
  function renderSoundBtn() {
    btnSound.innerHTML = Mascot.sound ? ICON.soundOn : ICON.soundOff;
    btnSound.setAttribute('aria-pressed', String(Mascot.sound));
    btnSound.title = Mascot.sound ? 'Выключить звук' : 'Включить звук';
  }
  btnSound.addEventListener('click', () => {
    Mascot.sound = !Mascot.sound;
    renderSoundBtn();
    Mascot.sfx('ok');
  });
  renderSoundBtn();

  // ---------- озвучка слова (если есть русский голос) ----------
  const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  function ruVoice() {
    return canSpeak ? speechSynthesis.getVoices().find((v) => /^ru/i.test(v.lang)) : null;
  }
  function syncSpeakBtn() { btnSpeak.hidden = !ruVoice(); }
  if (canSpeak) {
    syncSpeakBtn();
    speechSynthesis.onvoiceschanged = syncSpeakBtn;
  }
  function speak(text) {
    const v = ruVoice();
    if (!v) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v;
    u.lang = v.lang;
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }
  btnSpeak.addEventListener('click', () => speak($('#qWord').textContent));

  // ---------- игра ----------
  let questions = [];
  let qi = 0;
  let score = 0;
  let streak = 0;
  let best = 0;
  let mistakes = [];
  let locked = false;
  const seen = new Set();

  function buildRound() {
    let fresh = BANK.filter((e) => !seen.has(e.w));
    if (fresh.length < ROUND) {
      seen.clear();
      fresh = BANK;
    }
    return shuffle(fresh).slice(0, ROUND).map((e) => {
      seen.add(e.w);
      const opts = shuffle([e.a, ...e.d]);
      return { ...e, opts, right: opts.indexOf(e.a) };
    });
  }

  function setProgress(frac) {
    $('#progress').style.width = (frac * 100) + '%';
    $('#progressBar').setAttribute('aria-valuenow', String(Math.round(frac * ROUND)));
  }

  function updateStreak(bump) {
    $('#streakNum').textContent = streak;
    streakEl.classList.toggle('off', streak === 0);
    streakEl.classList.toggle('hot', streak >= 3);
    if (bump) {
      streakEl.classList.remove('bump');
      void streakEl.offsetWidth;
      streakEl.classList.add('bump');
    }
  }

  function startGame() {
    questions = buildRound();
    qi = 0; score = 0; streak = 0; best = 0; mistakes = [];
    updateStreak(false);
    setProgress(0);
    show('quiz');
    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[qi];
    locked = false;
    hideSheet();

    $('#qWord').textContent = q.w;
    const tag = $('#qTag');
    tag.textContent = TAGS[q.t].text;
    tag.className = 'tag ' + TAGS[q.t].cls;

    const card = $('#qCard');
    card.classList.remove('enter');
    void card.offsetWidth;
    card.classList.add('enter');

    optsEl.innerHTML = '';
    q.opts.forEach((text, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.style.setProperty('--i', i);
      const key = document.createElement('span');
      key.className = 'opt-key';
      key.textContent = i + 1;
      const label = document.createElement('span');
      label.textContent = text;
      b.append(key, label);
      b.addEventListener('click', () => answer(i));
      optsEl.appendChild(b);
    });

    Mascot.question(qi === 0);
  }

  function answer(i) {
    if (locked || current !== 'quiz') return;
    locked = true;
    const q = questions[qi];
    const btns = [...optsEl.children];
    btns.forEach((b) => { b.disabled = true; });
    setProgress((qi + 1) / ROUND);

    if (i === q.right) {
      score++;
      streak++;
      best = Math.max(best, streak);
      btns[i].classList.add('correct');
      btns.forEach((b, k) => { if (k !== i) b.classList.add('dim'); });
      const title = Mascot.correct(streak, btns[i]);
      showSheet(true, title, `${q.w} — ${q.a}`);
      updateStreak(true);
    } else {
      streak = 0;
      btns[i].classList.add('wrong');
      btns[q.right].classList.add('correct');
      btns.forEach((b, k) => { if (k !== i && k !== q.right) b.classList.add('dim'); });
      btns[q.right].scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
      mistakes.push({ w: q.w, a: q.a, chosen: q.opts[i] });
      Mascot.wrong();
      showSheet(false, 'Правильный ответ:', `${q.w} — ${q.a}`);
      updateStreak(false);
    }
  }

  function showSheet(ok, title, sub) {
    sheet.classList.toggle('bad', !ok);
    $('#sheetIcon').innerHTML = ok ? ICON.check : ICON.cross;
    $('#sheetTitle').textContent = title;
    $('#sheetSub').textContent = sub;
    btnNext.textContent = qi === ROUND - 1 ? 'Итоги' : 'Дальше';
    btnNext.className = ok ? 'btn' : 'btn btn--red';
    sheet.classList.add('show');
    sheet.setAttribute('aria-hidden', 'false');
    setTimeout(() => btnNext.focus({ preventScroll: true }), 60);
  }

  function hideSheet() {
    sheet.classList.remove('show');
    sheet.setAttribute('aria-hidden', 'true');
  }

  function next() {
    if (!locked || current !== 'quiz') return;
    qi++;
    if (qi >= ROUND) finish();
    else renderQuestion();
  }

  function finish() {
    hideSheet();
    show('end');
    const { stars, title } = Mascot.finish(score, ROUND);
    $('#endTitle').textContent = title;

    const starsEl = $('#stars');
    starsEl.classList.remove('animate');
    starsEl.querySelectorAll('.star').forEach((s, k) => {
      s.classList.toggle('on', k < stars);
      s.style.animationDelay = (0.25 + k * 0.2) + 's';
    });
    void starsEl.getBoundingClientRect();
    starsEl.classList.add('animate');

    $('#statScore').textContent = `${score}/${ROUND}`;
    $('#statBest').textContent = best;
    $('#statAcc').textContent = Math.round(score / ROUND * 100) + '%';

    const list = $('#reviewList');
    list.innerHTML = '';
    $('#reviewTitle').textContent = mistakes.length
      ? 'Запомни слова-друзья:'
      : 'Ни одной ошибки — вот это да!';
    mistakes.forEach((m) => {
      const li = document.createElement('li');
      const pair = document.createElement('span');
      pair.className = 'pair';
      const w = document.createElement('span');
      w.textContent = m.w + ' — ';
      const a = document.createElement('span');
      a.className = 'ok';
      a.textContent = m.a;
      pair.append(w, a);
      const was = document.createElement('span');
      was.className = 'was';
      const s = document.createElement('s');
      s.textContent = m.chosen;
      was.append('твой ответ: ', s);
      li.append(pair, was);
      list.appendChild(li);
    });
  }

  function goStart() {
    hideSheet();
    show('start');
    Mascot.hello();
  }

  // ---------- события ----------
  $('#btnStart').addEventListener('click', () => { Mascot.sfx('hoot'); startGame(); });
  $('#btnAgain').addEventListener('click', startGame);
  btnNext.addEventListener('click', next);
  $('#btnQuit').addEventListener('click', () => {
    if (confirm('Закончить игру и вернуться в начало?')) goStart();
  });

  document.addEventListener('keydown', (e) => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (current === 'quiz' && !locked && /^[1-4]$/.test(e.key)) {
      answer(Number(e.key) - 1);
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && !(document.activeElement instanceof HTMLButtonElement)) {
      e.preventDefault();
      if (current === 'start' || current === 'end') startGame();
      else if (locked) next();
    }
  });

  show('start');
})();
</script>
</body>
</html>
