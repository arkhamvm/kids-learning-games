<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Слова-друзья</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 32L11 5L29 17Z' fill='%23ff9f43'/%3E%3Cpath d='M56 32L53 5L35 17Z' fill='%23ff9f43'/%3E%3Cellipse cx='32' cy='37' rx='27' ry='23' fill='%23ff9f43'/%3E%3Ccircle cx='21' cy='35' r='8' fill='%23fff'/%3E%3Ccircle cx='43' cy='35' r='8' fill='%23fff'/%3E%3Ccircle cx='22' cy='36' r='4.5' fill='%232b2b2b'/%3E%3Ccircle cx='42' cy='36' r='4.5' fill='%232b2b2b'/%3E%3Cpath d='M28 45L36 45L32 50Z' fill='%23ff7896'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #58cc02; --green-d: #46a302; --green-l: #d7ffb8; --green-t: #58a700;
    --red: #ff4b4b; --red-d: #ea2b2b; --red-l: #ffdfe0; --red-t: #ea2b2b;
    --blue: #1cb0f6; --blue-d: #1899d6; --blue-l: #ddf4ff;
    --purple: #ce82ff; --purple-l: #f4e5ff; --purple-t: #a568cc;
    --orange: #ff9600; --orange-l: #fff0db; --orange-t: #cc7800;
    --gold: #ffc800; --gold-d: #e6a800;
    --ink: #3c3c3c; --ink-2: #4b4b4b; --muted: #777; --faint: #afafaf;
    --line: #e5e5e5; --soft: #f7f7f7; --bg: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html, button { touch-action: manipulation; } /* no double-tap zoom on fast taps */
  body {
    background: var(--bg); color: var(--ink);
    font-family: Nunito, "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    font-weight: 700;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  .app { max-width: 680px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
  /* fit to screen height: fit() sets --k per screen (zoom < 1 on short screens, > 1 on tall ones) */
  .app, .sheet { zoom: var(--k, 1); }
  .app { min-height: calc(100dvh / var(--k, 1)); }
  .screen.measuring { flex: none; }
  main { flex: 1; display: flex; flex-direction: column; }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 14px; height: 64px; flex: none; }
  .icon-btn { width: 40px; height: 40px; border: 0; background: none; border-radius: 12px; display: grid; place-items: center; color: var(--faint); flex: none; }
  .progress { flex: 1; height: 16px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--green); border-radius: 99px; position: relative; transition: width .6s cubic-bezier(.3, 1.4, .5, 1); }
  .progress-fill::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.35); }
  .streak { display: flex; align-items: center; gap: 4px; min-width: 52px; font-size: 19px; font-weight: 900; color: var(--orange); flex: none; }
  .streak svg { width: 26px; height: 26px; }
  .streak.off { color: var(--faint); }
  .streak.off .flame-out { fill: var(--line); }
  .streak.off .flame-in { fill: #f0f0f0; }
  .streak.bump svg { animation: bump .45s cubic-bezier(.3, 1.6, .5, 1); }
  .streak.hot svg { filter: drop-shadow(0 0 6px rgba(255,150,0,.55)); }
  body:not([data-screen="quiz"]) .quiz-only { visibility: hidden; }

  /* ---------- screens ---------- */
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; animation: screenIn .35s ease both; }
  @keyframes screenIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } } /* from above: never adds scroll height */

  /* ---------- buttons ---------- */
  .btn {
    border: 0; border-radius: 16px; padding: 14px 26px;
    font-size: 17px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;
    background: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-d);
    transition: transform .08s, box-shadow .08s, filter .15s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--green-d); }
  .btn--red { background: var(--red); box-shadow: 0 4px 0 var(--red-d); }
  .btn--red:active { box-shadow: 0 0 0 var(--red-d); }
  .btn-wide { width: 100%; max-width: 360px; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  /* ---------- start / end ---------- */
  .center { align-items: center; text-align: center; gap: 14px; padding: 4px 0 40px; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hero .bubble { max-width: 340px; margin-bottom: 8px; }
  .mascot-slot--big { width: min(210px, 52vw); }
  h1, h2 { margin: 0; font-weight: 900; color: var(--ink); }
  h1 { font-size: clamp(32px, 7vw, 44px); }
  h2 { font-size: clamp(28px, 6vw, 36px); }
  .lead { margin: 0; max-width: 440px; font-size: 18px; line-height: 1.45; color: var(--muted); }
  .example { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; font-size: 20px; font-weight: 900; }
  .chip { padding: 8px 14px; background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; }
  .example .eq { color: var(--green); font-size: 26px; }
  .hint { margin: 2px 0 0; font-size: 14px; color: var(--faint); }

  /* ---------- quiz ---------- */
  .quiz { padding-bottom: 120px; } /* fit() sets it to the feedback sheet's height */
  .q-head { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  .mascot-slot--quiz { width: 124px; flex: none; }
  .q-head .bubble { flex: 1; max-width: 340px; }
  .q-card { margin-top: 14px; }
  .q-card.enter { animation: screenIn .35s ease both; }
  .q-label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; color: var(--muted); }
  .tag { padding: 3px 9px; border-radius: 8px; font-size: 13px; font-weight: 900; letter-spacing: .02em; }
  .tag--purple { background: var(--purple-l); color: var(--purple-t); }
  .tag--blue { background: var(--blue-l); color: var(--blue-d); }
  .tag--orange { background: var(--orange-l); color: var(--orange-t); }
  .tag--green { background: var(--green-l); color: var(--green-t); }
  .q-word { display: flex; align-items: center; gap: 14px; margin-top: 4px; font-size: clamp(36px, 9vw, 50px); font-weight: 900; color: var(--ink); line-height: 1.15; }
  .speak {
    width: 46px; height: 46px; flex: none; border: 0; border-radius: 14px; display: grid; place-items: center;
    background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-d); transition: transform .08s, box-shadow .08s;
  }
  .speak:active { transform: translateY(4px); box-shadow: 0 0 0 var(--blue-d); }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .opt {
    display: flex; align-items: center; gap: 12px; min-height: 70px; padding: 12px 16px;
    background: #fff; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 16px;
    text-align: left; font-size: 21px; font-weight: 800; color: var(--ink-2); hyphens: auto; overflow-wrap: break-word;
    transition: background .15s, border-color .15s, color .15s, opacity .25s, transform .08s;
    animation: optIn .3s ease backwards; animation-delay: calc(var(--i) * 55ms);
  }
  @keyframes optIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .opt:active:not(:disabled) { transform: translateY(2px); }
  .opt:disabled { cursor: default; }
  .opt { scroll-margin: 16px 0 230px; } /* keep the answer above the feedback sheet */
  /* hover only for real pointers — on touch screens :hover sticks after a tap */
  @media (hover: hover) {
    .icon-btn:hover { background: var(--soft); color: var(--muted); }
    .btn:hover { filter: brightness(1.06); }
    .opt:hover:not(:disabled) { background: var(--soft); }
  }
  .opt-key { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 9px; font-size: 14px; font-weight: 900; color: var(--faint); }
  .opt.correct { background: var(--green-l); border-color: var(--green); color: var(--green-t); animation: correctPop .4s cubic-bezier(.3, 1.6, .5, 1); }
  .opt.correct .opt-key { border-color: var(--green); color: var(--green-t); }
  .opt.wrong { background: var(--red-l); border-color: var(--red); color: var(--red-t); animation: shake .45s; }
  .opt.wrong .opt-key { border-color: var(--red); color: var(--red-t); }
  .opt.dim { opacity: .4; }
  @keyframes correctPop { 0% { transform: scale(1); } 45% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
  @keyframes bump { 0% { transform: scale(1); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }

  /* ---------- feedback sheet ---------- */
  /* the dock clips the parked sheet so it never adds scroll height */
  .sheet-dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; overflow: hidden; pointer-events: none; }
  .sheet {
    position: relative; pointer-events: auto;
    background: var(--green-l); transform: translateY(105%); visibility: hidden;
    transition: transform .3s cubic-bezier(.2, .9, .3, 1.1), visibility 0s .3s;
  }
  .sheet.show { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2, .9, .3, 1.1); }
  .sheet.bad { background: var(--red-l); }
  .sheet-inner { max-width: 680px; margin: 0 auto; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 14px; }
  .sheet-icon { width: 58px; height: 58px; flex: none; display: grid; place-items: center; border-radius: 50%; background: #fff; }
  .sheet-icon svg { width: 34px; height: 34px; }
  .sheet-title { font-size: 22px; font-weight: 900; color: var(--green-t); }
  .sheet-sub { margin-top: 2px; font-size: 17px; font-weight: 800; color: var(--green-t); }
  .sheet.bad .sheet-title, .sheet.bad .sheet-sub { color: var(--red-t); }
  .sheet-inner > [role="status"] { flex: 1; min-width: 0; } /* long text wraps, never pushes the button out */
  .sheet .btn { margin-left: auto; min-width: 150px; flex: none; }

  /* ---------- results ---------- */
  .stars { display: flex; align-items: flex-end; justify-content: center; gap: 6px; height: 84px; }
  .star { width: 56px; height: 56px; }
  .star:nth-child(2) { width: 76px; height: 76px; margin-bottom: 8px; }
  .star path { fill: var(--line); stroke: #d4d4d4; stroke-width: 1.2; stroke-linejoin: round; }
  .star.on path { fill: var(--gold); stroke: var(--gold-d); }
  .stars.animate .star.on { animation: starPop .55s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes starPop { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: none; } }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 460px; }
  .stat { border: 2px solid var(--c); border-radius: 16px; background: var(--c); overflow: hidden; }
  .stat-label { padding: 5px 4px; font-size: 12px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; color: #fff; }
  .stat-val { padding: 12px 4px; background: #fff; border-radius: 13px; font-size: 22px; font-weight: 900; color: var(--c); }
  .review { width: 100%; max-width: 460px; text-align: left; }
  .review h3 { margin: 6px 0 10px; font-size: 18px; font-weight: 900; }
  .review ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .review li { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 14px; }
  .pair { font-size: 18px; font-weight: 900; }
  .pair .ok { color: var(--green-t); }
  .was { font-size: 14px; color: var(--muted); }
  .was s { color: var(--red-t); }

  /* ===== MASCOT:CSS START ===== */
  /* Котёнок Рыжик: speech bubble + mascot + confetti. Source of truth: templates/mascot.html */
  .bubble {
    position: relative; background: #fff; border: 2px solid var(--line, #e5e5e5); border-radius: 18px;
    padding: 12px 16px; font-size: 17px; font-weight: 800; line-height: 1.35; color: var(--ink-2, #4b4b4b);
  }
  .bubble::before { content: ""; position: absolute; width: 18px; height: 18px; background: #fff; }
  .bubble--left::before { left: -11px; top: 50%; transform: translateY(-50%) rotate(45deg); border-left: 2px solid var(--line, #e5e5e5); border-bottom: 2px solid var(--line, #e5e5e5); }
  .bubble--down::before { left: 50%; bottom: -11px; transform: translateX(-50%) rotate(45deg); border-right: 2px solid var(--line, #e5e5e5); border-bottom: 2px solid var(--line, #e5e5e5); }
  .bubble.pop { animation: mascot-pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes mascot-pop { 0% { transform: scale(.85); opacity: .3; } 100% { transform: none; opacity: 1; } }

  .mascot { display: block; width: 100%; height: auto; overflow: visible; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .mascot * { transform-box: fill-box; }
  .mascot .m-shadow { transform-origin: center; animation: mascot-shadow 2.6s ease-in-out infinite; }
  .mascot .m-body { transform-origin: 50% 100%; animation: mascot-bob 2.6s ease-in-out infinite; }
  .mascot .m-tilt { transform-origin: 50% 100%; transition: transform .4s ease; }
  .mascot .m-tail { transform-origin: 0% 95%; animation: mascot-tail 2.6s ease-in-out infinite; transition: transform .3s ease; }
  .mascot .m-ear-l, .mascot .m-ear-r { transform-origin: 50% 75%; transition: transform .3s ease; }
  .mascot .m-paw-l { transform-origin: 85% 4%; transition: transform .3s ease; }
  .mascot .m-paw-r { transform-origin: 15% 4%; transition: transform .3s ease; }
  .mascot .m-lid { transform-origin: 50% 0; transform: scaleY(0); animation: mascot-blink 4.4s infinite; transition: transform .25s ease; }
  .mascot .m-mood { transition: transform .3s ease; }
  .mascot .m-open { transition: opacity .15s; }
  .mascot .m-happy, .mascot .m-brows, .mascot .m-cheeks, .mascot .m-tear { opacity: 0; transition: opacity .2s; }
  .mascot .m-mouth { transform-origin: 50% 0; transform: scaleY(0); transition: transform .2s ease; }
  .mascot .m-cap { transform-origin: 50% 100%; }
  @keyframes mascot-bob { 50% { transform: translateY(-4px); } }
  @keyframes mascot-shadow { 50% { transform: scaleX(.92); } }
  @keyframes mascot-blink { 0%, 91%, 100% { transform: scaleY(0); } 94% { transform: scaleY(1); } }
  @keyframes mascot-tail { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }

  /* wave: greeting */
  .mascot.is-wave .m-paw-r { animation: mascot-wave 1.1s ease-in-out infinite; }
  @keyframes mascot-wave { 0%, 100% { transform: rotate(-75deg); } 50% { transform: rotate(-108deg); } }

  /* think: question on screen */
  .mascot.is-think .m-tilt { transform: rotate(-5deg); }
  .mascot.is-think .m-mood { transform: translate(4px, -5px); }
  .mascot.is-think .m-ear-r { transform: rotate(14deg); }

  /* happy: correct answer */
  .mascot.is-happy .m-body { animation: mascot-hop .55s cubic-bezier(.3, .7, .4, 1) 2, mascot-bob 2.6s ease-in-out 1.1s infinite; }
  .mascot.is-happy .m-shadow { animation: mascot-hop-shadow .55s 2; }
  .mascot.is-happy .m-paw-l { animation: mascot-cheer-l .26s ease-in-out 4; }
  .mascot.is-happy .m-paw-r { animation: mascot-cheer-r .26s ease-in-out 4; }
  .mascot.is-happy .m-tail { animation: mascot-wag .22s ease-in-out 6, mascot-tail 2.6s ease-in-out 1.3s infinite; }
  .mascot.is-happy .m-ear-l { animation: mascot-perk-l .55s ease-in-out 2; }
  .mascot.is-happy .m-ear-r { animation: mascot-perk-r .55s ease-in-out 2; }
  .mascot.is-happy .m-open, .mascot.is-party .m-open { opacity: 0; }
  .mascot.is-happy .m-happy, .mascot.is-happy .m-cheeks,
  .mascot.is-party .m-happy, .mascot.is-party .m-cheeks { opacity: 1; }
  .mascot.is-happy .m-mouth, .mascot.is-party .m-mouth { transform: scaleY(1); }
  @keyframes mascot-hop {
    0% { transform: none; }
    20% { transform: scale(1.08, .9); }
    50% { transform: translateY(-28px) scale(.95, 1.06); }
    80% { transform: scale(1.04, .96); }
    100% { transform: none; }
  }
  @keyframes mascot-hop-shadow { 50% { transform: scale(.7); opacity: .05; } }
  @keyframes mascot-cheer-l { 50% { transform: rotate(75deg); } }
  @keyframes mascot-cheer-r { 50% { transform: rotate(-75deg); } }
  @keyframes mascot-wag { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
  @keyframes mascot-perk-l { 50% { transform: rotate(-10deg); } }
  @keyframes mascot-perk-r { 50% { transform: rotate(10deg); } }

  /* sad: wrong answer */
  .mascot.is-sad .m-body { animation: mascot-sad-shake .55s ease-in-out both; }
  .mascot.is-sad .m-paw-l { transform: rotate(-8deg); }
  .mascot.is-sad .m-paw-r { transform: rotate(8deg); }
  .mascot.is-sad .m-ear-l { transform: rotate(-24deg); }
  .mascot.is-sad .m-ear-r { transform: rotate(24deg); }
  .mascot.is-sad .m-tail { animation: none; transform: rotate(30deg); }
  .mascot.is-sad .m-lid { animation: none; }
  .mascot.is-sad .m-lid-l { transform: rotate(-14deg) scaleY(.42); }
  .mascot.is-sad .m-lid-r { transform: rotate(14deg) scaleY(.42); }
  .mascot.is-sad .m-mood { transform: translate(0, 6px); }
  .mascot.is-sad .m-brows { opacity: 1; }
  .mascot.is-sad .m-tear { opacity: 1; animation: mascot-tear 1.7s ease-in .35s infinite; }
  @keyframes mascot-sad-shake {
    0% { transform: none; }
    15% { transform: translateX(-7px) rotate(-5deg); }
    35% { transform: translateX(7px) rotate(5deg); }
    55% { transform: translateX(-4px) rotate(-2deg); }
    75% { transform: translateX(2px); }
    100% { transform: translateY(5px) scale(1.03, .95); }
  }
  @keyframes mascot-tear { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(42px); opacity: 0; } }

  /* party: good final result */
  .mascot.is-party .m-body { animation: mascot-hop .6s cubic-bezier(.3, .7, .4, 1) infinite; }
  .mascot.is-party .m-shadow { animation: mascot-hop-shadow .6s infinite; }
  .mascot.is-party .m-paw-l { animation: mascot-cheer-l .3s ease-in-out infinite; }
  .mascot.is-party .m-paw-r { animation: mascot-cheer-r .3s ease-in-out infinite; }
  .mascot.is-party .m-tail { animation: mascot-wag .22s ease-in-out infinite; }
  .mascot.is-party .m-ear-l { animation: mascot-perk-l .6s ease-in-out infinite; }
  .mascot.is-party .m-ear-r { animation: mascot-perk-r .6s ease-in-out infinite; }
  .mascot.is-party .m-cap { animation: mascot-cap-toss 1.2s ease-in-out infinite; }
  @keyframes mascot-cap-toss { 0%, 100% { transform: none; } 50% { transform: translateY(-14px) rotate(-14deg); } }

  /* poke: tap / click on the mascot */
  .mascot.poke .m-tilt { animation: mascot-wiggle .5s ease-in-out; }
  .mascot.poke .m-ear-l { animation: mascot-perk-l .25s ease-in-out 2; }
  @keyframes mascot-wiggle { 0%, 100% { transform: none; } 25% { transform: rotate(-9deg); } 60% { transform: rotate(7deg); } }

  .mascot-fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

  @media (prefers-reduced-motion: reduce) {
    .mascot *, .bubble { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  /* ===== MASCOT:CSS END ===== */

  @media (max-width: 460px) {
    .options { gap: 10px; margin-top: 16px; }
    .opt { min-height: 62px; font-size: 19px; padding: 10px 12px; }
    .mascot-slot--quiz { width: 100px; }
    .q-head .bubble { font-size: 16px; padding: 10px 14px; }
    .sheet-inner { gap: 10px; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
    .sheet-icon { width: 40px; height: 40px; }
    .sheet-icon svg { width: 24px; height: 24px; }
    .sheet-title { font-size: 18px; }
    .sheet-sub { font-size: 15px; }
    .sheet .btn { min-width: 0; padding: 12px 16px; font-size: 15px; }
    .stat-label { font-size: 10px; }
  }
  @media (pointer: coarse) {
    .opt-key { display: none; } /* keyboard hints are useless on touch screens */
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>

<script>
// ===== MASCOT:JS START =====
// Котёнок Рыжик: mascot controller. Source of truth: templates/mascot.html
const Mascot = (() => {
  const el = document.getElementById('mascot');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const phrases = {
    hello: 'Привет! Я котёнок Рыжик. Давай играть!',
    first: 'Мяу! Выбирай правильный ответ!',
    ask: ['Подумай хорошенько…', 'Мяу! Выбирай!', 'Я знаю, ты справишься!', 'Какой ответ правильный?'],
    ok: ['Молодец!', 'Верно!', 'Супер!', 'Умница!', 'Так держать!', 'Ух ты, здорово!', 'Правильно!', 'Вот это да!'],
    okTitle: ['Отлично!', 'Верно!', 'Превосходно!', 'Правильно!', 'Здорово!'],
    bad: ['Ой! Ничего страшного.', 'Почти! Запомни этот ответ.', 'Мяу… ошибочка. Ты справишься!', 'Не беда, идём дальше!'],
    streak: { 3: 'Три подряд! Ты в ударе!', 5: 'Пять подряд! Мур-мур-мур!', 7: 'Семь подряд! Невероятно!', 10: 'Десять подряд! Ты чемпион!' },
    poke: ['Мяу!', 'Мур-р-р…', 'Хи-хи, щекотно!', 'Я в тебя верю!', 'Котики обожают учиться!'],
    results: [
      { title: 'Попробуем ещё раз?', say: 'Не грусти! С каждым разом будет получаться лучше.' },
      { title: 'Хорошее начало!', say: 'У тебя уже получается. Давай ещё!' },
      { title: 'Отлично!', say: 'Здорово! Ещё чуть-чуть — и будет идеально!' },
      { title: 'Великолепно!', say: 'Мур-р! Ты настоящий знаток!' },
    ],
  };

  let lastPick = null;
  function pick(arr) {
    let x;
    do { x = arr[Math.floor(Math.random() * arr.length)]; } while (arr.length > 1 && x === lastPick);
    return (lastPick = x);
  }

  // ---- state + speech bubble ----
  let bubble = null;
  let busy = false; // an answer reaction is on screen: poking doesn't replace its phrase
  function set(state) {
    el.classList.remove('is-wave', 'is-think', 'is-happy', 'is-sad', 'is-party');
    el.getBoundingClientRect(); // restart CSS animations
    if (state) el.classList.add('is-' + state);
  }
  function say(text) {
    if (!bubble) return;
    bubble.textContent = text;
    bubble.classList.remove('pop');
    void bubble.offsetWidth;
    bubble.classList.add('pop');
  }
  function mount(slot, bubbleEl) {
    if (slot && el.parentNode !== slot) slot.appendChild(el);
    bubble = bubbleEl || null;
  }

  // ---- eyes follow the mouse / finger ----
  const tracks = el.querySelectorAll('.m-track');
  function look(x, y) {
    const r = el.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2);
    const dy = y - (r.top + r.height * 0.42);
    const d = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, d / 260) * 5;
    const t = `translate(${(dx / d * k).toFixed(1)} ${(dy / d * k).toFixed(1)})`;
    tracks.forEach((g) => g.setAttribute('transform', t));
  }
  addEventListener('pointermove', (e) => look(e.clientX, e.clientY), { passive: true });
  addEventListener('pointerdown', (e) => look(e.clientX, e.clientY), { passive: true });
  document.documentElement.addEventListener('pointerleave', (e) => {
    if (e.pointerType === 'mouse') tracks.forEach((g) => g.removeAttribute('transform'));
  });
  // iOS Safari applies :active (button press effect) only when a touchstart listener exists
  document.addEventListener('touchstart', () => {}, { passive: true });

  // ---- poke ----
  el.addEventListener('click', () => {
    el.classList.remove('poke');
    el.getBoundingClientRect();
    el.classList.add('poke');
    sfx('meow');
    if (!busy) say(pick(phrases.poke));
  });
  el.addEventListener('animationend', (e) => {
    if (e.animationName === 'mascot-wiggle') el.classList.remove('poke');
  });

  // ---- sound: Web Audio, no files; on/off shared by all games ----
  let actx = null;
  let soundOn = true;
  try { soundOn = localStorage.getItem('mascot-sound') !== 'off'; } catch (e) {}
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, at, dur, type = 'sine', vol = 0.18, toFreq) {
    const a = audio();
    if (!a) return;
    const t0 = a.currentTime + at;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  }
  function meow() {
    // sawtooth through a sweeping low-pass filter: "m-i-a-u"
    const a = audio();
    if (!a) return;
    const t0 = a.currentTime;
    const o = a.createOscillator();
    const f = a.createBiquadFilter();
    const g = a.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(480, t0);
    o.frequency.linearRampToValueAtTime(820, t0 + 0.14);
    o.frequency.exponentialRampToValueAtTime(420, t0 + 0.5);
    f.type = 'lowpass';
    f.Q.value = 6;
    f.frequency.setValueAtTime(1200, t0);
    f.frequency.linearRampToValueAtTime(2200, t0 + 0.14);
    f.frequency.exponentialRampToValueAtTime(800, t0 + 0.5);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
    o.connect(f).connect(g).connect(a.destination);
    o.start(t0);
    o.stop(t0 + 0.6);
  }
  const SFX = {
    ok:   () => { tone(784, 0, 0.12, 'sine', 0.2); tone(1047, 0.09, 0.24, 'sine', 0.2); },
    bad:  () => { tone(330, 0, 0.16, 'triangle', 0.24, 300); tone(247, 0.14, 0.32, 'triangle', 0.24, 210); },
    meow,
    win:  () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, k * 0.1, 0.28, 'sine', 0.16)),
    end:  () => [523, 659, 784].forEach((f, k) => tone(f, k * 0.13, 0.24, 'sine', 0.14)),
  };
  function sfx(name) {
    if (!soundOn || !SFX[name]) return;
    try { SFX[name](); } catch (e) {}
  }

  // ---- confetti ----
  const fx = document.createElement('canvas');
  fx.className = 'mascot-fx';
  fx.setAttribute('aria-hidden', 'true');
  document.body.appendChild(fx);
  const ctx = fx.getContext('2d');
  const COLORS = ['#58cc02', '#1cb0f6', '#ffc800', '#ff4b4b', '#ce82ff', '#ff9600'];
  let parts = [];
  let raf = 0;
  let dpr = 1;
  function sizeFx() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    fx.width = innerWidth * dpr;
    fx.height = innerHeight * dpr;
  }
  addEventListener('resize', sizeFx);
  sizeFx();
  function spawn(x, y, vx, vy, max) {
    parts.push({
      x, y, vx, vy, max, life: 0,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
      r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
      c: COLORS[Math.floor(Math.random() * COLORS.length)],
    });
  }
  function run() { if (!raf) raf = requestAnimationFrame(tick); }
  function tick() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life < p.max && p.y < innerHeight + 30);
    for (const p of parts) {
      p.life++;
      p.vy = (p.vy + 0.18) * 0.985;
      p.vx *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.r += p.vr;
      ctx.globalAlpha = Math.min(1, (p.max - p.life) / 20);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life * 0.15 + p.r)) + 1);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }
  function burst(x, y, n = 26) {
    if (reduceMotion) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 2 + Math.random() * 5;
      spawn(x, y, Math.cos(a) * s, Math.sin(a) * s - 3, 60 + Math.random() * 40);
    }
    run();
  }
  function rain() {
    if (reduceMotion) return;
    for (let i = 0; i < 170; i++) {
      spawn(Math.random() * innerWidth, -20 - Math.random() * innerHeight * 0.7, (Math.random() - 0.5) * 2, 2 + Math.random() * 3, 320);
    }
    run();
  }

  // ---- game events ----
  function hello(text) {
    busy = false;
    set('wave');
    say(text || phrases.hello);
  }
  function question(isFirst) {
    busy = false;
    set('think');
    say(isFirst ? phrases.first : pick(phrases.ask));
  }
  function correct(streak, fromEl) {
    busy = true;
    set('happy');
    sfx('ok');
    say(phrases.streak[streak] || pick(phrases.ok));
    if (fromEl) {
      const r = fromEl.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2);
    }
    return pick(phrases.okTitle);
  }
  function wrong() {
    busy = true;
    set('sad');
    sfx('bad');
    say(pick(phrases.bad));
  }
  function finish(score, total) {
    const ratio = total ? score / total : 0;
    const stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : ratio >= 0.4 ? 1 : 0;
    const res = phrases.results[stars];
    busy = false;
    set(stars >= 2 ? 'party' : stars === 1 ? 'happy' : 'wave');
    say(res.say);
    sfx(stars >= 2 ? 'win' : 'end');
    if (stars >= 2) setTimeout(rain, 250);
    return { stars, title: res.title };
  }

  return {
    el, phrases, pick, mount, set, say, sfx, burst, rain, audio,
    hello, question, correct, wrong, finish,
    get sound() { return soundOn; },
    set sound(on) {
      soundOn = Boolean(on);
      try { localStorage.setItem('mascot-sound', soundOn ? 'on' : 'off'); } catch (e) {}
    },
  };
})();

  // ---------- helpers ----------

  const shuffle = (arr) => {
    const a = arr.slice();

      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];

  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- elements ----------

  const optsEl = $('#options');
  const sheet = $('#sheet');
  const btnNext = $('#btnNext');
  const btnSound = $('#btnSound');
  const btnSpeak = $('#btnSpeak');
  const streakEl = $('#streak');

  // ---------- screens ----------
  let current = 'start';

  function show(name) {
    current = name;
    Object.entries(screens).forEach(([k, el]) => el.classList.toggle('active', k === name));
    document.body.dataset.screen = name;
    Mascot.mount(slots[name], bubbles[name]);

  }

  // ---------- масштаб под высоту экрана ----------
  // zoom = доступная высота / естественная высота экрана, в пределах [min, max] для каждого экрана.
  const FIT = { start: [0.7, 1.4], quiz: [0.6, 1.4], end: [0.8, 1.3] };
  const lockedK = {}; // screen → zoom for the current visit: content changes may only shrink it (no size jumps)
  function sheetHeight() {
    const t = $('#sheetTitle');
    const s = $('#sheetSub');
    const empty = !t.textContent;
    if (empty) { t.textContent = 'Правильный ответ:'; s.textContent = 'здороваться — приветствовать'; }
    const h = sheet.offsetHeight;
    if (empty) { t.textContent = ''; s.textContent = ''; }
    return h;
  }
  function fit(lock) {
    const scr = screens[current];
    const [minK, maxK] = FIT[current];
    const root = document.documentElement.style;
    root.setProperty('--k', '1');
    if (current === 'quiz') scr.style.paddingBottom = sheetHeight() + 'px';
    scr.classList.add('measuring');
    const natural = $('.topbar').offsetHeight + scr.offsetHeight;
    scr.classList.remove('measuring');
    let k = Math.max(minK, Math.min(maxK, innerWidth / 360, innerHeight / natural));
    if (lock) {
      if (lockedK[current]) k = Math.min(k, lockedK[current]);

    }

  }

  function buildRound() {
    let fresh = BANK.filter((e) => !seen.has(e.w));

      fresh = BANK;

    return shuffle(fresh).slice(0, ROUND).map((e) => {

      streak = 0;

    if (!locked || current !== 'quiz') return;
    qi++;
    if (qi >= ROUND) finish();

  }

  function finish() {
    hideSheet();
    show('end');
    const { stars, title } = Mascot.finish(score, ROUND);

      s.classList.toggle('on', k < stars);
      s.style.animationDelay = (0.25 + k * 0.2) + 's';

    if (confirm('Закончить игру и вернуться в начало?')) goStart();

    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;

      else if (locked) next();
    }
  });

})();
