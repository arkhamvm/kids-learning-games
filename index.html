<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учимся играя</title>
<meta name="description" content="Небольшие обучающие игры для младших школьников с совёнком Ухом.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='28' fill='%2358cc02'/%3E%3Ccircle cx='22' cy='30' r='10' fill='%23fff'/%3E%3Ccircle cx='42' cy='30' r='10' fill='%23fff'/%3E%3Ccircle cx='23' cy='31' r='5' fill='%233c3c3c'/%3E%3Ccircle cx='41' cy='31' r='5' fill='%233c3c3c'/%3E%3Cpath d='M28 41 L36 41 L32 48 Z' fill='%23ff9600'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #58cc02; --green-d: #46a302; --green-l: #d7ffb8; --green-t: #58a700;
    --blue: #1cb0f6; --blue-d: #1899d6; --blue-l: #ddf4ff;
    --purple: #ce82ff; --purple-l: #f4e5ff; --purple-t: #a568cc;
    --ink: #3c3c3c; --ink-2: #4b4b4b; --muted: #777; --faint: #afafaf;
    --line: #e5e5e5; --soft: #f7f7f7; --bg: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html, button, a { touch-action: manipulation; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Nunito, "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-weight: 700;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  .page { max-width: 680px; margin: 0 auto; padding: 0 16px 48px; }
  .topbar { display: flex; justify-content: flex-end; height: 56px; align-items: center; }
  .icon-btn { width: 40px; height: 40px; border: 0; background: none; border-radius: 12px; display: grid; place-items: center; color: var(--faint); }

  .hero { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .hero .bubble { max-width: 320px; margin-bottom: 8px; }
  .slot { width: min(180px, 46vw); }
  h1 { margin: 14px 0 0; font-size: clamp(32px, 7vw, 44px); font-weight: 900; text-align: center; }
  .lead { margin: 6px auto 0; max-width: 440px; text-align: center; font-size: 18px; line-height: 1.45; color: var(--muted); }

  .games { display: grid; gap: 14px; margin-top: 28px; }
  .game {
    display: flex; align-items: center; gap: 16px; padding: 16px;
    border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 20px;
    color: inherit; text-decoration: none; background: #fff;
    transition: transform .08s, background .15s;
  }
  .game:active { transform: translateY(2px); }
  .game-icon {
    width: 72px; height: 72px; flex: none; display: grid; place-items: center; border-radius: 18px;
    background: var(--c); box-shadow: 0 4px 0 var(--cd); color: #fff; font-size: 40px; font-weight: 900;
  }
  .game-text { flex: 1; min-width: 0; }
  .game-title { font-size: 22px; font-weight: 900; }
  .game-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .tag { padding: 2px 8px; border-radius: 8px; font-size: 13px; font-weight: 900; background: var(--blue-l); color: var(--blue-d); }
  .tag--purple { background: var(--purple-l); color: var(--purple-t); }
  .game p { margin: 6px 0 0; font-size: 15px; line-height: 1.4; color: var(--muted); }
  .game-go {
    flex: none; padding: 10px 16px; border-radius: 14px; font-size: 15px; font-weight: 900;
    text-transform: uppercase; letter-spacing: .05em; color: #fff; background: var(--green); box-shadow: 0 4px 0 var(--green-d);
  }
  .soon { border-style: dashed; border-bottom-width: 2px; color: var(--faint); justify-content: center; text-align: center; padding: 22px 16px; }
  .foot { margin-top: 28px; text-align: center; font-size: 14px; color: var(--faint); }
  .foot a { color: var(--blue-d); }

  @media (hover: hover) {
    .game:hover { background: var(--soft); }
    .icon-btn:hover { background: var(--soft); color: var(--muted); }
  }
  @media (max-width: 460px) {
    .game { flex-wrap: wrap; }
    .game-icon { width: 60px; height: 60px; font-size: 32px; }
    .game-go { width: 100%; text-align: center; }
  }

  /* ===== OWL:CSS START ===== */
  /* Совёнок Ух: speech bubble + mascot + confetti. Source of truth: templates/owl-mascot.html */
  .bubble {
    position: relative; background: #fff; border: 2px solid var(--line, #e5e5e5); border-radius: 18px;
    padding: 12px 16px; font-size: 17px; font-weight: 800; line-height: 1.35; color: var(--ink-2, #4b4b4b);
  }
  .bubble::before { content: ""; position: absolute; width: 18px; height: 18px; background: #fff; }
  .bubble--left::before { left: -11px; top: 50%; transform: translateY(-50%) rotate(45deg); border-left: 2px solid var(--line, #e5e5e5); border-bottom: 2px solid var(--line, #e5e5e5); }
  .bubble--down::before { left: 50%; bottom: -11px; transform: translateX(-50%) rotate(45deg); border-right: 2px solid var(--line, #e5e5e5); border-bottom: 2px solid var(--line, #e5e5e5); }
  .bubble.pop { animation: owl-pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes owl-pop { 0% { transform: scale(.85); opacity: .3; } 100% { transform: none; opacity: 1; } }

  .owl { display: block; width: 100%; height: auto; overflow: visible; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .owl * { transform-box: fill-box; }
  .owl .o-shadow { transform-origin: center; animation: owl-shadow 2.6s ease-in-out infinite; }
  .owl .o-body { transform-origin: 50% 100%; animation: owl-bob 2.6s ease-in-out infinite; }
  .owl .o-tilt { transform-origin: 50% 100%; transition: transform .4s ease; }
  .owl .o-wing-l { transform-origin: 85% 5%; transition: transform .3s ease; }
  .owl .o-wing-r { transform-origin: 15% 5%; transition: transform .3s ease; }
  .owl .o-lid { transform-origin: 50% 0; transform: scaleY(0); animation: owl-blink 4.4s infinite; transition: transform .25s ease; }
  .owl .o-mood { transition: transform .3s ease; }
  .owl .o-open { transition: opacity .15s; }
  .owl .o-happy, .owl .o-brows, .owl .o-cheeks, .owl .o-tear { opacity: 0; transition: opacity .2s; }
  .owl .o-mouth { transform-origin: 50% 0; transform: scaleY(0); transition: transform .2s ease; }
  .owl .o-cap { transform-origin: 50% 100%; }
  @keyframes owl-bob { 50% { transform: translateY(-4px); } }
  @keyframes owl-shadow { 50% { transform: scaleX(.92); } }
  @keyframes owl-blink { 0%, 91%, 100% { transform: scaleY(0); } 94% { transform: scaleY(1); } }

  /* wave: greeting */
  .owl.is-wave .o-wing-r { animation: owl-wave 1.1s ease-in-out infinite; }
  @keyframes owl-wave { 0%, 100% { transform: rotate(-110deg); } 50% { transform: rotate(-150deg); } }

  /* think: question on screen */
  .owl.is-think .o-tilt { transform: rotate(-5deg); }
  .owl.is-think .o-mood { transform: translate(4px, -5px); }

  /* happy: correct answer */
  .owl.is-happy .o-body { animation: owl-hop .55s cubic-bezier(.3, .7, .4, 1) 2, owl-bob 2.6s ease-in-out 1.1s infinite; }
  .owl.is-happy .o-shadow { animation: owl-hop-shadow .55s 2; }
  .owl.is-happy .o-wing-l { animation: owl-flap-l .26s ease-in-out 4; }
  .owl.is-happy .o-wing-r { animation: owl-flap-r .26s ease-in-out 4; }
  .owl.is-happy .o-open, .owl.is-party .o-open { opacity: 0; }
  .owl.is-happy .o-happy, .owl.is-happy .o-cheeks,
  .owl.is-party .o-happy, .owl.is-party .o-cheeks { opacity: 1; }
  .owl.is-happy .o-mouth, .owl.is-party .o-mouth { transform: scaleY(1); }
  @keyframes owl-hop {
    0% { transform: none; }
    20% { transform: scale(1.08, .9); }
    50% { transform: translateY(-28px) scale(.95, 1.06); }
    80% { transform: scale(1.04, .96); }
    100% { transform: none; }
  }
  @keyframes owl-hop-shadow { 50% { transform: scale(.7); opacity: .05; } }
  @keyframes owl-flap-l { 50% { transform: rotate(60deg); } }
  @keyframes owl-flap-r { 50% { transform: rotate(-60deg); } }

  /* sad: wrong answer */
  .owl.is-sad .o-body { animation: owl-sad-shake .55s ease-in-out both; }
  .owl.is-sad .o-wing-l { transform: rotate(-10deg); }
  .owl.is-sad .o-wing-r { transform: rotate(10deg); }
  .owl.is-sad .o-lid { animation: none; }
  .owl.is-sad .o-lid-l { transform: rotate(-14deg) scaleY(.42); }
  .owl.is-sad .o-lid-r { transform: rotate(14deg) scaleY(.42); }
  .owl.is-sad .o-mood { transform: translate(0, 6px); }
  .owl.is-sad .o-brows { opacity: 1; }
  .owl.is-sad .o-tear { opacity: 1; animation: owl-tear 1.7s ease-in .35s infinite; }
  @keyframes owl-sad-shake {
    0% { transform: none; }
    15% { transform: translateX(-7px) rotate(-5deg); }
    35% { transform: translateX(7px) rotate(5deg); }
    55% { transform: translateX(-4px) rotate(-2deg); }
    75% { transform: translateX(2px); }
    100% { transform: translateY(5px) scale(1.03, .95); }
  }
  @keyframes owl-tear { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(42px); opacity: 0; } }

  /* party: good final result */
  .owl.is-party .o-body { animation: owl-hop .6s cubic-bezier(.3, .7, .4, 1) infinite; }
  .owl.is-party .o-shadow { animation: owl-hop-shadow .6s infinite; }
  .owl.is-party .o-wing-l { animation: owl-flap-l .3s ease-in-out infinite; }
  .owl.is-party .o-wing-r { animation: owl-flap-r .3s ease-in-out infinite; }
  .owl.is-party .o-cap { animation: owl-cap-toss 1.2s ease-in-out infinite; }
  @keyframes owl-cap-toss { 0%, 100% { transform: none; } 50% { transform: translateY(-14px) rotate(-14deg); } }

  /* poke: tap / click on the owl */
  .owl.poke .o-tilt { animation: owl-wiggle .5s ease-in-out; }
  @keyframes owl-wiggle { 0%, 100% { transform: none; } 25% { transform: rotate(-9deg); } 60% { transform: rotate(7deg); } }

  .owl-fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

  @media (prefers-reduced-motion: reduce) {
    .owl *, .bubble { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  /* ===== OWL:CSS END ===== */
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <button class="icon-btn" id="btnSound" type="button" aria-label="Звук" aria-pressed="true"></button>
  </header>

  <div class="hero">
    <div class="bubble bubble--down pop" id="bubble">Привет! Я совёнок Ух. Выбирай игру!</div>
    <div class="slot" id="slot">
      <!-- ===== OWL:SVG START ===== -->
      <svg class="owl is-wave" id="owl" viewBox="0 0 200 220" role="img" aria-label="Совёнок Ух">
        <defs>
          <clipPath id="eyeClipL"><circle cx="76" cy="92" r="23"/></clipPath>

        </defs>
        <ellipse class="o-shadow" cx="100" cy="207" rx="52" ry="7" fill="#000" opacity=".1"/>

            <!-- лапки -->
            <g fill="#ff9600">

            <!-- животик -->
            <ellipse cx="100" cy="158" rx="42" ry="36" fill="#d7ffb8"/>
            <path d="M84 150q4 6 8 0M96 150q4 6 8 0M108 150q4 6 8 0M90 164q4 6 8 0M102 164q4 6 8 0" fill="none" stroke="#a5e86a" stroke-width="3" stroke-linecap="round"/>
            <!-- лицевой диск -->
            <g fill="#89e04a"><circle cx="76" cy="92" r="30"/><circle cx="124" cy="92" r="30"/></g>
            <!-- открытые глаза -->
            <g class="o-open">
              <g clip-path="url(#eyeClipL)">
                <circle cx="76" cy="92" r="23" fill="#fff"/>

                  <circle cx="79" cy="94" r="11.5" fill="#3c3c3c"/>

              <g clip-path="url(#eyeClipR)">
                <circle cx="124" cy="92" r="23" fill="#fff"/>

                  <circle cx="121" cy="94" r="11.5" fill="#3c3c3c"/>

                  <circle cx="117" cy="99" r="1.8" fill="#fff"/>
                </g></g>
                <rect class="o-lid o-lid-r" x="92" y="62" width="64" height="62" fill="#7bd43c"/>
              </g>
            </g>
            <!-- счастливые глазки ^ ^ -->
            <g class="o-happy" fill="none" stroke="#3c3c3c" stroke-width="6.5" stroke-linecap="round">
              <path d="M61 98Q76 78 91 98"/><path d="M109 98Q124 78 139 98"/>

            <!-- грустные бровки -->
            <g class="o-brows" fill="none" stroke="#3d8a00" stroke-width="5.5" stroke-linecap="round">

  <h1>Учимся играя</h1>
  <p class="lead">Небольшие игры для младших школьников. Играй в браузере на телефоне или компьютере.</p>

  <div class="games">
    <a class="game" href="games/sinonimy/">
      <div class="game-icon" style="--c: var(--green); --cd: var(--green-d)">≈</div>
      <div class="game-text">
        <div class="game-title">Слова-друзья</div>
        <div class="game-meta"><span class="tag tag--purple">2 класс</span><span class="tag">Синонимы</span></div>
        <p>Найди слово, которое значит почти то же самое.</p>
      </div>
      <span class="game-go">Играть</span>

  <p class="foot"><a href="templates/owl-mascot.html">Как устроен совёнок Ух</a></p>

<script>
// ===== OWL:JS START =====
// Совёнок Ух: mascot controller. Source of truth: templates/owl-mascot.html
const Mascot = (() => {
  const owl = document.getElementById('owl');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const phrases = {
    hello: 'Привет! Я совёнок Ух. Давай играть!',
    first: 'Ух-ух! Выбирай правильный ответ!',
    ask: ['Подумай хорошенько…', 'Ух-ух! Выбирай!', 'Я знаю, ты справишься!', 'Какой ответ правильный?'],
    ok: ['Молодец!', 'Верно!', 'Супер!', 'Умница!', 'Так держать!', 'Ух ты, здорово!', 'Правильно!', 'Вот это да!'],
    okTitle: ['Отлично!', 'Верно!', 'Превосходно!', 'Правильно!', 'Здорово!'],
    bad: ['Ой! Ничего страшного.', 'Почти! Запомни этот ответ.', 'Ух… ошибочка. Ты справишься!', 'Не беда, идём дальше!'],
    streak: { 3: 'Три подряд! Ты в ударе!', 5: 'Пять подряд! Ух-ух-ух!', 7: 'Семь подряд! Невероятно!', 10: 'Десять подряд! Ты чемпион!' },
    poke: ['Ух-ух!', 'Хи-хи, щекотно!', 'Я в тебя верю!', 'Совы обожают учиться!', 'Ух! Привет-привет!'],
    results: [
      { title: 'Попробуем ещё раз?', say: 'Не грусти! С каждым разом будет получаться лучше.' },
      { title: 'Хорошее начало!', say: 'У тебя уже получается. Давай ещё!' },
      { title: 'Отлично!', say: 'Здорово! Ещё чуть-чуть — и будет идеально!' },
      { title: 'Великолепно!', say: 'Ух-ух! Ты настоящий знаток!' },
    ],
  };

  let lastPick = null;
  function pick(arr) {
    let x;
    do { x = arr[Math.floor(Math.random() * arr.length)]; } while (arr.length > 1 && x === lastPick);
    return (lastPick = x);
  }

  // ---- state + speech bubble ----
  let bubble = null;
  let busy = false; // an answer reaction is on screen: poking doesn't replace its phrase
  function set(state) {
    owl.classList.remove('is-wave', 'is-think', 'is-happy', 'is-sad', 'is-party');
    owl.getBoundingClientRect(); // restart CSS animations
    if (state) owl.classList.add('is-' + state);
  }
  function say(text) {
    if (!bubble) return;
    bubble.textContent = text;
    bubble.classList.remove('pop');
    void bubble.offsetWidth;
    bubble.classList.add('pop');
  }
  function mount(slot, bubbleEl) {
    if (slot && owl.parentNode !== slot) slot.appendChild(owl);
    bubble = bubbleEl || null;
  }

  // ---- eyes follow the mouse / finger ----
  const tracks = owl.querySelectorAll('.o-track');
  function look(x, y) {
    const r = owl.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2);
    const dy = y - (r.top + r.height * 0.42);
    const d = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, d / 260) * 5;
    const t = `translate(${(dx / d * k).toFixed(1)} ${(dy / d * k).toFixed(1)})`;
    tracks.forEach((g) => g.setAttribute('transform', t));
  }
  addEventListener('pointermove', (e) => look(e.clientX, e.clientY), { passive: true });
  addEventListener('pointerdown', (e) => look(e.clientX, e.clientY), { passive: true });
  document.documentElement.addEventListener('pointerleave', (e) => {
    if (e.pointerType === 'mouse') tracks.forEach((g) => g.removeAttribute('transform'));
  });
  // iOS Safari applies :active (button press effect) only when a touchstart listener exists
  document.addEventListener('touchstart', () => {}, { passive: true });

  // ---- poke ----
  owl.addEventListener('click', () => {
    owl.classList.remove('poke');
    owl.getBoundingClientRect();
    owl.classList.add('poke');
    sfx('hoot');
    if (!busy) say(pick(phrases.poke));
  });
  owl.addEventListener('animationend', (e) => {
    if (e.animationName === 'owl-wiggle') owl.classList.remove('poke');
  });

  // ---- sound: Web Audio, no files; on/off shared by all games ----
  let actx = null;
  let soundOn = true;
  try { soundOn = localStorage.getItem('owl-sound') !== 'off'; } catch (e) {}
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, at, dur, type = 'sine', vol = 0.18, toFreq) {
    const a = audio();
    if (!a) return;
    const t0 = a.currentTime + at;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  }
  const SFX = {
    ok:   () => { tone(784, 0, 0.12, 'sine', 0.2); tone(1047, 0.09, 0.24, 'sine', 0.2); },
    bad:  () => { tone(330, 0, 0.16, 'triangle', 0.24, 300); tone(247, 0.14, 0.32, 'triangle', 0.24, 210); },
    hoot: () => { tone(540, 0, 0.16, 'sine', 0.16, 450); tone(540, 0.22, 0.24, 'sine', 0.16, 410); },
    win:  () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, k * 0.1, 0.28, 'sine', 0.16)),
    end:  () => [523, 659, 784].forEach((f, k) => tone(f, k * 0.13, 0.24, 'sine', 0.14)),
  };
  function sfx(name) {
    if (!soundOn || !SFX[name]) return;
    try { SFX[name](); } catch (e) {}
  }

  // ---- confetti ----
  const fx = document.createElement('canvas');
  fx.className = 'owl-fx';
  fx.setAttribute('aria-hidden', 'true');
  document.body.appendChild(fx);
  const ctx = fx.getContext('2d');
  const COLORS = ['#58cc02', '#1cb0f6', '#ffc800', '#ff4b4b', '#ce82ff', '#ff9600'];
  let parts = [];
  let raf = 0;
  let dpr = 1;
  function sizeFx() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    fx.width = innerWidth * dpr;
    fx.height = innerHeight * dpr;
  }
  addEventListener('resize', sizeFx);
  sizeFx();
  function spawn(x, y, vx, vy, max) {
    parts.push({
      x, y, vx, vy, max, life: 0,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
      r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
      c: COLORS[Math.floor(Math.random() * COLORS.length)],
    });
  }
  function run() { if (!raf) raf = requestAnimationFrame(tick); }
  function tick() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life < p.max && p.y < innerHeight + 30);
    for (const p of parts) {
      p.life++;
      p.vy = (p.vy + 0.18) * 0.985;
      p.vx *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.r += p.vr;
      ctx.globalAlpha = Math.min(1, (p.max - p.life) / 20);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life * 0.15 + p.r)) + 1);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }
  function burst(x, y, n = 26) {
    if (reduceMotion) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 2 + Math.random() * 5;
      spawn(x, y, Math.cos(a) * s, Math.sin(a) * s - 3, 60 + Math.random() * 40);
    }
    run();
  }
  function rain() {
    if (reduceMotion) return;
    for (let i = 0; i < 170; i++) {
      spawn(Math.random() * innerWidth, -20 - Math.random() * innerHeight * 0.7, (Math.random() - 0.5) * 2, 2 + Math.random() * 3, 320);
    }
    run();
  }

  // ---- game events ----
  function hello(text) {
    busy = false;
    set('wave');
    say(text || phrases.hello);
  }
  function question(isFirst) {
    busy = false;
    set('think');
    say(isFirst ? phrases.first : pick(phrases.ask));
  }
  function correct(streak, fromEl) {
    busy = true;
    set('happy');
    sfx('ok');
    say(phrases.streak[streak] || pick(phrases.ok));
    if (fromEl) {
      const r = fromEl.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2);
    }
    return pick(phrases.okTitle);
  }
  function wrong() {
    busy = true;
    set('sad');
    sfx('bad');
    say(pick(phrases.bad));
  }
  function finish(score, total) {
    const ratio = total ? score / total : 0;
    const stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : ratio >= 0.4 ? 1 : 0;
    const res = phrases.results[stars];
    busy = false;
    set(stars >= 2 ? 'party' : stars === 1 ? 'happy' : 'wave');
    say(res.say);
    sfx(stars >= 2 ? 'win' : 'end');
    if (stars >= 2) setTimeout(rain, 250);
    return { stars, title: res.title };
  }

  return {
    el: owl, phrases, pick, mount, set, say, sfx, burst, rain,
    hello, question, correct, wrong, finish,
    get sound() { return soundOn; },
    set sound(on) {
      soundOn = Boolean(on);
      try { localStorage.setItem('owl-sound', soundOn ? 'on' : 'off'); } catch (e) {}
    },
  };
})();
// ===== OWL:JS END =====

(() => {
  const btnSound = document.getElementById('btnSound');
  const ICON_ON = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>';
  function renderSound() {
    btnSound.innerHTML = Mascot.sound ? ICON_ON : ICON_OFF;
    btnSound.setAttribute('aria-pressed', String(Mascot.sound));
    btnSound.title = Mascot.sound ? 'Выключить звук' : 'Включить звук';
  }
  btnSound.addEventListener('click', () => { Mascot.sound = !Mascot.sound; renderSound(); Mascot.sfx('ok'); });
  renderSound();

  Object.assign(Mascot.phrases, {
    poke: ['Ух-ух!', 'Хи-хи, щекотно!', 'Выбирай игру!', 'Совы обожают учиться!', 'Ух! Привет-привет!'],
  });
  Mascot.mount(document.getElementById('slot'), document.getElementById('bubble'));
})();
</script>
</body>
